<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>La Boutique · Kel'Empreinte</title>
<meta name="description" content="Toutes les créations Kel'Empreinte : boucles d'oreilles, colliers, nœuds papillon, bagues et bracelets en résine et fleurs séchées. Pièces uniques, faites main en France.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kel'Empreinte">
<meta property="og:title" content="La Boutique · Kel'Empreinte">
<meta property="og:description" content="Toutes les créations Kel'Empreinte : pièces uniques en résine et fleurs séchées, faites main en France.">
<meta property="og:url" content="https://kel-empreinte.pages.dev/boutique/">
<meta property="og:image" content="https://kel-empreinte.pages.dev/images/logo/og-image-kel-empreinte.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="200x200" href="/images/logo/logo-kel-empreinte.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Work+Sans:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/tooplate-ivory-style.css">
<link rel="stylesheet" href="/shop.css">
</head>
<body class="page-shop">
<!-- Gabarit de /boutique/ — build.js remplit les régions « build:… » depuis data/products.json
     et écrit boutique/index.html (dossier généré, non versionné). Chemins absolus : la page vit
     sous /boutique/. La navigation est celle de l'accueil, « Boutique » active ; les autres entrées
     renvoient aux sections de l'accueil. -->

<div class="est-label" aria-hidden="true">Fabrication Française</div>

<!-- build:nav:start — généré par build.js depuis templates/partials/nav.html et NAV_ITEMS -->
<!-- build:nav:end -->

<main class="shop" id="boutique">
  <header class="shop-header">
    <p class="shop-eyebrow">Pièces uniques, faites main</p>
    <h1 class="shop-title">La Boutique</h1>
    <!-- build:shop-intro:start — généré par build.js, le lien WhatsApp vient de data/site.json -->
    <!-- build:shop-intro:end -->
  </header>

  <!-- Arrivée depuis une collection de l'accueil (?collection=<id>) : mention avec croix, remplie par shop.js -->
  <p class="shop-collection" id="shopCollection" hidden>
    <span class="shop-collection-label">Collection&nbsp;:</span>
    <span class="shop-collection-name" id="shopCollectionName"></span>
    <button type="button" class="shop-collection-clear" id="shopCollectionClear" aria-label="Voir toutes les pièces">&times;</button>
  </p>

  <!-- Deux barres de puces, cumulables ; les compteurs initiaux sont posés au build, shop.js les
       recalcule selon les filtres actifs. Un type sans pièce n'a pas de puce. -->
  <div class="shop-filters">
    <div class="shop-chips" role="group" aria-label="Public" data-filter="audience">
      <!-- build:shop-chips-audience:start — généré par build.js -->
      <!-- build:shop-chips-audience:end -->
    </div>
    <div class="shop-chips" role="group" aria-label="Type de pièce" data-filter="category">
      <!-- build:shop-chips-category:start — généré par build.js -->
      <!-- build:shop-chips-category:end -->
    </div>
  </div>

  <div class="shop-toolbar">
    <!-- check-site.js lit ce compteur : « class="shop-count" » -->
    <!-- build:shop-count:start — généré par build.js -->
    <!-- build:shop-count:end -->
    <ul class="shop-active" id="shopActive" aria-label="Filtres actifs" hidden></ul>
  </div>

  <ul class="shop-grid" id="shopGrid" aria-live="polite">
    <!-- build:shop-cards:start — généré par build.js depuis data/products.json -->
    <!-- build:shop-cards:end -->
  </ul>
  <p class="shop-empty" id="shopEmpty" hidden>Aucune pièce ne correspond à ces filtres. <button type="button" class="cta-link" id="shopReset">Tout afficher</button></p>
</main>

<!-- build:footer:start — généré par build.js depuis templates/partials/footer.html et data/site.json -->
<!-- build:footer:end -->

<!-- Noms des collections, pour la mention « Collection : … » (shop.js) -->
<script type="application/json" id="shopCollections">
<!-- build:shop-collections-json:start — généré par build.js depuis data/collections.json -->
<!-- build:shop-collections-json:end -->
</script>
<script src="/catalog.js"></script>
<script src="/site.js"></script>
<script src="/shop.js"></script>
</body>
</html>
