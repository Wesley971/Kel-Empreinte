<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<!-- build:piece-head:start — titre, description et balises og: générés par build.js pour chaque pièce -->
<!-- build:piece-head:end -->
<link rel="icon" type="image/png" sizes="200x200" href="/images/logo/logo-kel-empreinte.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Work+Sans:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/tooplate-ivory-style.css">
<link rel="stylesheet" href="/shop.css">
</head>
<body class="page-piece">
<!-- Gabarit d'une page pièce — build.js remplit les régions « build:… » depuis
     data/products.json et écrit boutique/<id>/index.html pour chaque pièce visible (disponible,
     réservée, vendue). Chemins absolus : la page vit sous /boutique/<id>/. -->

<div class="est-label" aria-hidden="true">Fabrication Française</div>

<!-- build:nav:start — généré par build.js depuis templates/partials/nav.html et NAV_ITEMS -->
<!-- build:nav:end -->

<!-- Zoom sur une photo (site.js) -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" aria-label="Fermer">&times;</button>
  <figure class="lightbox-figure">
    <img class="lightbox-img" alt="">
    <figcaption class="lightbox-caption" hidden>
      <span class="lightbox-caption-name"></span>
      <span class="lightbox-caption-dimensions"></span>
      <p class="lightbox-caption-desc"></p>
    </figcaption>
  </figure>
</div>

<main class="piece">
  <nav class="piece-breadcrumb" aria-label="Fil d'Ariane">
    <a href="/boutique/" class="cta-link cta-link--dark">&larr; Toutes les pièces</a>
  </nav>
  <!-- build:piece:start — généré par build.js depuis data/products.json -->
  <!-- build:piece:end -->
</main>

<!-- build:footer:start — généré par build.js depuis templates/partials/footer.html et data/site.json -->
<!-- build:footer:end -->

<script src="/catalog.js"></script>
<script src="/site.js"></script>
<script src="/shop.js"></script>
</body>
</html>
