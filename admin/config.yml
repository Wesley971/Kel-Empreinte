backend:
  name: github
  repo: Wesley971/Kel-Empreinte
  branch: master
  base_url: "https://sveltia-cms-auth.abdoulwes.workers.dev"

# Habillage Sveltia : titre de l'interface et logo (connexion, en-tête, favicon).
# Les couleurs de l'interface ne sont pas personnalisables (limite Sveltia).
app_title: "Mes bijoux — Kel'Empreinte"
logo:
  src: /admin/logo.png
  show_in_header: true

media_folder: "images"
public_folder: "images"

collections:
  - name: "products"
    label: "Catalogue"
    files:
      - name: "catalog"
        label: "Bijoux"
        file: "data/products.json"
        fields:
          - label: "Bijoux"
            name: "products"
            widget: "list"
            root: true
            label_singular: "bijou"
            summary: "{{name}}"
            fields:
              - label: "Identifiant"
                name: "id"
                widget: "string"
                required: true
                hint: "Mot-clé unique pour cette pièce, en minuscules, sans espace ni accent, ex. \"boucles-fleur-rose\". Invisible sur le site ; ne plus le changer une fois la pièce créée."
                pattern: ["^[a-z0-9-]+$", "Lettres minuscules, chiffres et tirets uniquement"]

              - label: "Nom"
                name: "name"
                widget: "string"
                required: true
                hint: "Nom affiché sur la carte de la pièce, ex. \"Herbier Jaune Velours\"."

              - label: "Catégorie"
                name: "category"
                widget: "select"
                required: true
                options:
                  - { label: "Boucles d'oreilles", value: "boucles-oreilles" }
                  - { label: "Nœud", value: "noeud" }
                  - { label: "Pendentif", value: "pendentif" }
                  - { label: "Bracelet", value: "bracelet" }
                  - { label: "Bague", value: "bague" }

              - label: "Disponibilité"
                name: "availability"
                widget: "select"
                required: true
                options:
                  - { label: "Disponible", value: "disponible" }
                  - { label: "Bientôt (pas encore de photo)", value: "bientot" }
                hint: "Attention : une pièce \"Disponible\" sans photo (champ \"Photos\" plus bas) s'affiche quand même en \"Bientôt\" sur le site, sans prix ni bouton Commander. Pour qu'elle soit vraiment en vente, ajoute au moins une photo."

              - label: "Personnalisable"
                name: "customizable"
                widget: "boolean"
                required: false
                default: false
                hint: "Coche si cette pièce peut être personnalisée (couleur, etc.). Un badge \"Personnalisable\" apparaît sur sa carte dans la collection ; en cliquant dessus, la cliente ouvre WhatsApp avec une demande de personnalisation pré-remplie."

              - label: "Dimensions"
                name: "dimensions"
                widget: "string"
                required: false
                hint: "Texte libre, ex. \"4 cm × 2 cm\" ou \"environ 5 cm de long\". Le site affiche \"Dimensions :\" devant. Laisser vide si inconnu."

              - label: "Description (une ou deux phrases)"
                name: "desc"
                widget: "text"
                required: false
                pattern: ["^[\\s\\S]{0,240}$", "240 caractères maximum"]
                hint: "Matière et geste artisanal, ex. \"fleurs séchées et éclats d'or, coulés à la main\". Affichée sous la photo agrandie dans la collection, et dans le carrousel d'accueil pour les pièces mises en avant."

              - label: "Type de prix"
                name: "priceType"
                widget: "select"
                required: true
                default: "fixe"
                options:
                  - { label: "Prix fixe", value: "fixe" }
                  - { label: "Sur devis", value: "devis" }
                hint: "Le champ \"Prix\" ci-dessous n'est utilisé que si \"Prix fixe\" est sélectionné."

              - label: "Prix (en euros, sans le symbole €)"
                name: "price"
                widget: "number"
                value_type: "float"
                required: false
                min: 0
                comment: "Obligatoire si la pièce est \"Disponible\" avec \"Prix fixe\" : sans prix, ta modification n'arrive pas sur le site, qui garde sa version précédente."
                hint: "Ignoré si \"Sur devis\" est sélectionné ci-dessus. Laisser vide pour une pièce \"Bientôt\"."

              - label: "Prix confirmé"
                name: "priceConfirmed"
                widget: "boolean"
                required: false
                default: true
                hint: "Repère pour toi : décoche si ce prix est encore provisoire. Sans effet sur le site : le prix s'affiche que cette case soit cochée ou non."

              - label: "Photos"
                name: "images"
                widget: "list"
                required: false
                label_singular: "Photo"
                summary: "{{fields.alt}}"
                hint: "La première photo est celle affichée sur la carte. Sans photo, la pièce apparaît en \"Bientôt\" sur le site, même si elle est marquée \"Disponible\"."
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - { label: "Description de l'image (accessibilité)", name: "alt", widget: "string", required: true, hint: "Décris la photo en quelques mots, ex. \"Boucles d'oreilles Herbier Jaune Velours, fleurs séchées dans la résine\". Lue à voix haute par les lecteurs d'écran et utilisée par Google." }

              - label: "Mettre en avant (carrousel page d'accueil)"
                name: "featured"
                widget: "boolean"
                required: false
                default: false
                hint: "Si coché, cette pièce apparaît aussi dans le grand carrousel en haut de la page d'accueil (3 pièces recommandées). Remplir alors aussi les champs ci-dessous : sans titre et nom complet, elle n'y apparaît pas."

              - label: "Ordre dans le carrousel (1, 2, 3…)"
                name: "featuredOrder"
                widget: "number"
                required: false
                value_type: "int"
                min: 1
                hint: "Uniquement si \"Mettre en avant\" est coché."

              - label: "Titre affiché dans le carrousel"
                name: "heading"
                widget: "string"
                required: false
                hint: "Uniquement si \"Mettre en avant\" est coché. Obligatoire dans ce cas, sinon la pièce n'apparaît pas dans le carrousel."

              - label: "Nom complet (pour le message de contact)"
                name: "plainName"
                widget: "string"
                required: false
                hint: "Uniquement si \"Mettre en avant\" est coché. Obligatoire dans ce cas, sinon la pièce n'apparaît pas dans le carrousel. C'est ce nom qui est inséré dans le message WhatsApp du bouton \"Commander\" du carrousel, ex. \"Boucles d'oreilles Herbier Jaune Velours\"."

              - label: "Badge"
                name: "badge"
                widget: "string"
                required: false
                default: "Pièce Signature"
                hint: "Uniquement si \"Mettre en avant\" est coché."

              - label: "Fiche technique (une phrase)"
                name: "specs"
                widget: "text"
                required: false
                hint: "Uniquement si \"Mettre en avant\" est coché. Matières et finitions, ex. \"Fleurs séchées, résine, crochets en acier inoxydable\". Affichée sous la description dans le carrousel."
