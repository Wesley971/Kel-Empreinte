<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <!-- Espace privé : jamais dans les résultats de recherche, même si un lien fuit. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Mes bijoux — Kel'Empreinte</title>
  <link rel="icon" type="image/png" sizes="200x200" href="/images/logo/logo-kel-empreinte.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Nom et icône du raccourci « écran d'accueil » de Prescilia (KD-66) : start_url et scope = /admin/.
       use-credentials : un manifest se charge sans cookie par défaut, et derrière Access cette requête
       serait renvoyée vers la page de connexion — avec le cookie de session, elle passe. -->
  <link rel="manifest" href="/admin/manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- tokens.css : la palette du site, partagée — l'écran ne copie aucune couleur -->
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/admin/gestion.css" />
</head>
<body>
  <!-- Écran « Mes bijoux » — /admin/ (KD-92, cinq états avec KD-98, à /admin/ depuis KD-95) : les pièces groupées par état, une
       pastille d'état qui ouvre la feuille d'actions, « Marquer vendue » à un tap. Tout le
       comportement est dans gestion.js ; la liste est rendue à partir de GET /api/admin/products
       (la vérité du dépôt, pas le JSON du site qui a 1 à 2 min de retard). -->
  <!-- En-tête et statut restent visibles en haut de l'écran pendant qu'on fait défiler la liste -->
  <div class="kel-top">
    <header class="kel-header">
      <!-- Logo : la version claire (« Empreinte » en crème) quand l'appareil est en mode sombre — KD-101 -->
      <picture>
        <source srcset="/images/logo/logo-kel-empreinte-dark-mode.png" media="(prefers-color-scheme: dark)" />
        <img class="kel-header-logo" src="/images/logo/logo-kel-empreinte.png" alt="" width="36" height="36" />
      </picture>
      <h1 class="kel-header-title">Mes bijoux</h1>
      <nav class="kel-header-nav" aria-label="Liens utiles">
        <a href="/" target="_blank" rel="noopener">Voir le site ↗</a>
      </nav>
    </header>

    <!-- Statut global : visible tant qu'au moins une modification est en cours d'enregistrement -->
    <p class="kel-status" id="status" role="status" aria-live="polite" hidden>
      <span class="kel-status-dot" aria-hidden="true"></span>Mise à jour du site en cours…
    </p>
  </div>

  <main class="kel-main">
    <!-- Recherche (KD-102) : filtre la liste en direct sur le nom et la référence, mot par mot, sans
         casse ni accents. Rien n'est écrit, rien n'est mémorisé : champ vide à chaque ouverture. Elle
         défile avec la liste ; la zone collante reste à l'en-tête et au statut. Montrée une fois la
         liste chargée. -->
    <form class="kel-search" id="search-form" role="search" hidden>
      <label class="kel-visually-hidden" for="search">Rechercher une pièce par son nom ou sa référence</label>
      <span class="kel-search-icon" aria-hidden="true"></span>
      <input type="search" id="search" name="q" placeholder="Nom ou référence" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />
      <button type="button" class="kel-search-clear" id="search-clear" aria-label="Effacer la recherche" hidden>×</button>
    </form>
    <p class="kel-summary" id="summary" aria-live="polite"></p>
    <p class="kel-loading" id="loading">Chargement de vos bijoux…</p>
    <div class="kel-error" id="error" role="alert" hidden>
      <p id="error-text"></p>
      <button type="button" class="kel-button" id="retry">Réessayer</button>
    </div>
    <!-- Les groupes (En vente, Réservées, Brouillons, Vendues, Retirées) sont rendus ici -->
    <div id="groups"></div>
    <!-- Aucune pièce ne correspond à la recherche -->
    <div class="kel-empty" id="empty" hidden>
      <p id="empty-text"></p>
      <button type="button" class="kel-button kel-button--secondary" id="empty-clear">Effacer la recherche</button>
    </div>
  </main>

  <!-- Confirmation après enregistrement -->
  <div class="kel-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Gabarit d'un groupe ; gestion.js le clone pour chaque état qui a des pièces -->
  <template id="group-template">
    <section class="kel-group">
      <h2 class="kel-group-title"><span class="kel-group-name"></span> <span class="kel-group-count"></span></h2>
      <ul class="kel-list"></ul>
    </section>
  </template>

  <!-- Gabarit d'une ligne ; gestion.js le clone pour chaque pièce -->
  <template id="row-template">
    <li class="kel-row">
      <div class="kel-row-photo"></div>
      <div class="kel-row-body">
        <p class="kel-row-name"></p>
        <p class="kel-row-meta"></p>
      </div>
      <div class="kel-row-actions">
        <button type="button" class="kel-state" aria-haspopup="dialog"><span class="kel-state-dot" aria-hidden="true"></span><span class="kel-state-text"></span><span class="kel-state-chevron" aria-hidden="true"></span></button>
        <button type="button" class="kel-quick" hidden>Marquer vendue</button>
      </div>
      <!-- Sous le nom et les boutons, sur toute la largeur : le détail de l'état, ce qui manque, l'erreur -->
      <div class="kel-row-foot">
        <p class="kel-row-note" hidden></p>
        <p class="kel-row-hint" hidden></p>
        <p class="kel-row-error" role="alert" hidden></p>
      </div>
    </li>
  </template>

  <!-- Feuille d'actions d'une pièce : ce que son état permet (catalog.js, allowedTransitions) -->
  <dialog class="kel-sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="kel-sheet-body">
      <p class="kel-sheet-title" id="sheet-title"></p>
      <p class="kel-sheet-state" id="sheet-state"></p>
      <div class="kel-sheet-actions" id="sheet-actions"></div>
      <form method="dialog"><button type="submit" class="kel-button kel-button--secondary kel-sheet-cancel" value="cancel">Annuler</button></form>
    </div>
  </dialog>

  <!-- Confirmation d'une phrase, pour ce qui ne se défait pas d'un geste -->
  <dialog class="kel-sheet" id="confirm" aria-labelledby="confirm-title">
    <form method="dialog" class="kel-sheet-body">
      <p class="kel-sheet-title" id="confirm-title"></p>
      <p class="kel-sheet-text" id="confirm-text"></p>
      <div class="kel-sheet-buttons">
        <button type="submit" class="kel-button kel-button--secondary" value="cancel">Annuler</button>
        <button type="submit" class="kel-button" id="confirm-ok" value="ok"></button>
      </div>
    </form>
  </dialog>

  <!-- Marquer vendue : montant encaissé (facultatif), canal, date — la date de vente se corrige,
       jamais au futur ; la date de réservation, elle, ne se saisit nulle part -->
  <dialog class="kel-sheet" id="sale" aria-labelledby="sale-title">
    <form class="kel-sheet-body" id="sale-form" novalidate>
      <p class="kel-sheet-title" id="sale-title">Marquer vendue</p>
      <p class="kel-sheet-text" id="sale-piece"></p>
      <label class="kel-field">
        <span class="kel-field-label">Montant encaissé</span>
        <span class="kel-field-amount">
          <input type="text" inputmode="decimal" id="sale-amount" name="amount" placeholder="ex. 45" autocomplete="off" />
          <span class="kel-field-unit">€</span>
        </span>
        <span class="kel-field-help">Ce que vous avez réellement reçu. Vous pourrez le compléter plus tard.</span>
      </label>
      <fieldset class="kel-field">
        <legend class="kel-field-label">Vendue où ?</legend>
        <div class="kel-choices" id="sale-channels"></div>
      </fieldset>
      <label class="kel-field kel-field--inline">
        <span class="kel-field-label">Date de la vente</span>
        <input type="date" id="sale-date" name="date" />
      </label>
      <p class="kel-sheet-error" id="sale-error" role="alert" hidden></p>
      <div class="kel-sheet-buttons">
        <button type="button" class="kel-button kel-button--secondary" id="sale-cancel">Annuler</button>
        <button type="submit" class="kel-button" id="sale-submit">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="/catalog.js"></script>
  <script src="/admin/common.js"></script>
  <script src="/admin/gestion.js"></script>
</body>
</html>
