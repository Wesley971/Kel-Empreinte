<body class="page-404">
<!-- Servie par Cloudflare Pages, avec un vrai code 404, pour tout chemin inconnu — dont l'adresse
     d'une pièce passée en brouillon ou retirée du site : un lien envoyé sur WhatsApp ne doit pas
     tomber sur une erreur brute. Sans ce fichier, Pages servirait l'accueil en 200. -->
<main class="not-found">
  <!-- Logo : la version claire (« Empreinte » en crème) quand l'appareil est en mode sombre — KD-101 -->
  <picture>
    <source srcset="/images/logo/logo-kel-empreinte-dark-mode.png" media="(prefers-color-scheme: dark)">
    <img class="not-found-logo" src="/images/logo/logo-kel-empreinte.png" alt="Kel'Empreinte" width="72" height="72">
  </picture>
  <p class="not-found-eyebrow">Page introuvable</p>
  <h1 class="not-found-title">Cette page n'existe pas,<br>ou cette pièce n'est plus proposée.</h1>
  <p class="not-found-text">Chaque création est unique&nbsp;: quand une pièce trouve preneur, sa page peut disparaître. La boutique montre tout ce qui est disponible aujourd'hui.</p>
  <p class="not-found-actions">
    <a href="/boutique/" class="piece-cta">Voir la boutique</a>
    <a href="/" class="cta-link cta-link--dark">Retour à l'accueil</a>
  </p>
</main>
</body>
</html>
